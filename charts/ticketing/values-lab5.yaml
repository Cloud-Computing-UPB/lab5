# Overlay folosit în Laboratorul 5 după instalarea kube-prometheus-stack.
config:
  appVersion: "1.0.0-observable"
  artificialDelayMs: 0
  failureRate: 0
  cpuBurnMs: 0

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 50

monitoring:
  serviceMonitor:
    enabled: true
  prometheusRule:
    enabled: true
  grafanaDashboard:
    enabled: true
