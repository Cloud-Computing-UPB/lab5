{{- if not .Values.postgresql.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ticketing.secretName" . }}
  labels:
    {{- include "ticketing.commonLabels" . | nindent 4 }}
type: Opaque
stringData:
  DB_PASSWORD: {{ required "postgresql.auth.password trebuie setată când existingSecret este gol" .Values.postgresql.auth.password | quote }}
{{- end }}

