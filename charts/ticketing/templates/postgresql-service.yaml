apiVersion: v1
kind: Service
metadata:
  name: {{ include "ticketing.postgresqlName" . }}
  labels:
    {{- include "ticketing.commonLabels" . | nindent 4 }}
    {{- include "ticketing.postgresqlSelectorLabels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "ticketing.postgresqlSelectorLabels" . | nindent 4 }}
  ports:
    - name: postgresql
      port: {{ .Values.postgresql.service.port }}
      targetPort: postgresql
      protocol: TCP

