apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "ticketing.fullname" . }}-test-connection"
  labels:
    {{- include "ticketing.commonLabels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: wget
      image: busybox:1.36.1
      command:
        - wget
      args:
        - --spider
        - --timeout=5
        - "http://{{ include "ticketing.apiName" . }}:{{ .Values.api.service.port }}/readyz"
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL

