name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tickets
          POSTGRES_PASSWORD: tickets
          POSTGRES_DB: tickets_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tickets -d tickets_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://tickets:tickets@localhost:5432/tickets_test?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

  chart:
    name: Validate Helm chart
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.16.4

      - name: Lint chart
        run: helm lint charts/ticketing --strict

      - name: Render default values
        run: helm template ticketing charts/ticketing --namespace cc-lab5 > /dev/null

      - name: Render observability overlay
        run: >-
          helm template ticketing charts/ticketing
          --namespace cc-lab5
          --values charts/ticketing/values-lab5.yaml
          > /dev/null

      - name: Render controlled incident overlay
        run: >-
          helm template ticketing charts/ticketing
          --namespace cc-lab5
          --values charts/ticketing/values-lab5.yaml
          --values charts/ticketing/values-incident.yaml
          > /dev/null

      - name: Package chart
        run: |
          mkdir -p dist
          helm package charts/ticketing --destination dist

      - uses: actions/upload-artifact@v4
        with:
          name: ticketing-helm-chart
          path: dist/*.tgz

  docker:
    name: Build and publish image
    # Publicăm imaginea numai după validarea codului și a chart-ului.
    needs: [test, chart]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          # Pull requests only verify the image builds; nothing is published.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
